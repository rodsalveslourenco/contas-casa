services:
  - type: web
    name: contas-casa
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: contas-casa-db
          property: connectionString

databases:
  - name: contas-casa-db
    databaseName: contas_casa
    user: contas_casa
    plan: free
